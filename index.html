<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenny's Pokémon Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script>
  // Gen 2 clock: MORN 4-10, DAY 10-18, NITE 18-4
  (function () {
    const h = new Date().getHours();
    document.documentElement.dataset.time = h >= 4 && h < 10 ? "morn" : h >= 10 && h < 18 ? "day" : "nite";
  })();
</script>
<style>
  :root {
    --ink: #181820;
    --paper: #f8f8f0;
    --paper-2: #e8e8d8;
    --shade: rgba(16, 16, 32, .35);
    --red: #d83820;
    --gold: #e0b030;
    --silver: #b8c0d0;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --term: "VT323", ui-monospace, monospace;

    /* scene palette: day */
    --sk1: #5898f0; --sk2: #78b0f8; --sk3: #98c8f8; --sk4: #c0e0f8;
    --sun: #f8f0a0; --cl1: #ffffff; --cl2: #c8d8f0; --mt1: #6890c0; --mt2: #88a8d0;
    --tr1: #205820; --tr2: #48a048; --tr3: #88d068; --tk1: #704020; --tk2: #985830;
    --gr1: #78c050; --gr2: #5aa038; --gr3: #407828; --pa1: #e8d098; --pa2: #c8a868;
    --tg1: #388828; --tg2: #68b848; --fe1: #885028; --fe2: #b07840; --sg1: #e8c890; --sg2: #a07848;
    --fl1: #f86848; --fl2: #f8e858; --star: transparent;
  }
  :root[data-time="morn"] {
    --sk1: #f0a090; --sk2: #f8b8a0; --sk3: #f8d0a8; --sk4: #f8e4c0;
    --sun: #fff8d8; --cl1: #fff0e8; --cl2: #e8c0b8; --mt1: #9888b0; --mt2: #b8a8c8;
  }
  :root[data-time="nite"] {
    --sk1: #0c1430; --sk2: #142048; --sk3: #1c3060; --sk4: #284070;
    --sun: #f0f0d0; --cl1: #44507a; --cl2: #2c3858; --mt1: #24304e; --mt2: #34446a;
    --tr1: #0a2416; --tr2: #18442c; --tr3: #2a6040; --tk1: #3c2414; --tk2: #4c3020;
    --gr1: #285434; --gr2: #20482c; --gr3: #163820; --pa1: #807460; --pa2: #605848;
    --tg1: #183c24; --tg2: #285a36; --fe1: #46301e; --fe2: #5a402a; --sg1: #807058; --sg2: #584834;
    --fl1: #b04848; --fl2: #b8b860; --star: #f8f8d8;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sk4); color: var(--ink);
    font: 10px/1.8 var(--pixel); -webkit-font-smoothing: none; font-smooth: never;
  }

  /* ---------- background scene ---------- */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; image-rendering: pixelated; }
  .sk1 { fill: var(--sk1); } .sk2 { fill: var(--sk2); } .sk3 { fill: var(--sk3); } .sk4 { fill: var(--sk4); }
  .sun { fill: var(--sun); } .cl1 { fill: var(--cl1); } .cl2 { fill: var(--cl2); }
  .mt1 { fill: var(--mt1); } .mt2 { fill: var(--mt2); }
  .tr1 { fill: var(--tr1); } .tr2 { fill: var(--tr2); } .tr3 { fill: var(--tr3); }
  .tk1 { fill: var(--tk1); } .tk2 { fill: var(--tk2); }
  .gr1 { fill: var(--gr1); } .gr2 { fill: var(--gr2); } .gr3 { fill: var(--gr3); }
  .pa1 { fill: var(--pa1); } .pa2 { fill: var(--pa2); }
  .tg1 { fill: var(--tg1); } .tg2 { fill: var(--tg2); }
  .fe1 { fill: var(--fe1); } .fe2 { fill: var(--fe2); } .sg1 { fill: var(--sg1); } .sg2 { fill: var(--sg2); }
  .fl1 { fill: var(--fl1); } .fl2 { fill: var(--fl2); } .star { fill: var(--star); }
  .cloud { animation: drift 90s steps(90) infinite; }
  .cloud.c1 { animation-duration: 140s; animation-delay: -40s; }
  .cloud.c2 { animation-duration: 110s; animation-delay: -80s; }
  @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(300px); } }
  .flower.fa { animation: wiggle 1.2s steps(1) infinite; }
  .flower.fb { animation: wiggle 1.2s steps(1) infinite -.6s; }
  @keyframes wiggle { 0% { transform: translateX(0); } 50% { transform: translateX(1px); } }
  .stars rect { animation: twinkle 3s steps(1) infinite; }
  .stars rect:nth-child(3n) { animation-delay: -1s; } .stars rect:nth-child(3n+1) { animation-delay: -2s; }
  @keyframes twinkle { 0%, 70% { opacity: 1; } 71%, 100% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .cloud, .flower, .stars rect { animation: none !important; } }

  /* ---------- text boxes ---------- */
  main { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  .box {
    background: var(--paper);
    border: 4px solid var(--ink);
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--ink), 6px 6px 0 var(--shade);
    padding: 18px 18px 16px;
    margin-bottom: 18px;
  }
  .box h2 {
    font: 10px/1 var(--pixel); margin: 0 0 14px; letter-spacing: 1px;
    display: inline-block; background: var(--ink); color: var(--paper); padding: 6px 8px 5px;
  }

  /* ---------- title ---------- */
  .title { text-align: center; margin: 8px 0 26px; }
  .logo { display: inline-flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo .l1 {
    font-size: clamp(22px, 7vw, 40px); line-height: 1; color: var(--gold); letter-spacing: 2px;
    text-shadow: 3px 0 var(--ink), -3px 0 var(--ink), 0 3px var(--ink), 0 -3px var(--ink),
                 3px 3px var(--ink), -3px -3px var(--ink), 3px -3px var(--ink), -3px 3px var(--ink),
                 6px 6px 0 var(--shade);
  }
  .logo .l2 {
    font-size: clamp(12px, 3.4vw, 18px); line-height: 1; color: var(--silver); letter-spacing: 6px;
    text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink),
                 2px 2px var(--ink), -2px -2px var(--ink), 2px -2px var(--ink), -2px 2px var(--ink);
  }
  .clock {
    display: inline-block; margin-top: 16px; font: 20px/1 var(--term); letter-spacing: 1px;
    background: var(--ink); color: var(--paper); padding: 4px 10px 3px;
    box-shadow: 4px 4px 0 var(--shade);
  }

  /* ---------- menu-style controls ---------- */
  button, select, input[type="password"] {
    font: 10px/1 var(--pixel); color: var(--ink);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 0;
    padding: 9px 12px 8px; cursor: pointer;
  }
  button { position: relative; padding-left: 22px; text-transform: uppercase; }
  button::before { content: "▶"; position: absolute; left: 7px; top: 50%; transform: translateY(-52%); font-size: 8px; opacity: 0; }
  button:hover::before, button:focus-visible::before { opacity: 1; }
  button:hover, button:focus-visible { background: var(--paper-2); outline: none; }
  button:active { transform: translate(2px, 2px); }
  button.primary { background: var(--red); color: var(--paper); }
  button.primary:hover, button.primary:focus-visible { background: #b82810; }
  button:disabled { opacity: .6; cursor: wait; }
  button.link { border: 0; background: none; padding: 6px 0 0 16px; margin-top: 4px; font-size: 9px; }
  button.link::before { left: 2px; }
  select:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  input[type="password"] { cursor: text; letter-spacing: 3px; }
  input[type="password"]::placeholder { color: #8890a0; letter-spacing: 1px; }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
  label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 9px; }

  /* ---------- game lists (party style) ---------- */
  #cloudList, #lib { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  #cloudList li, #lib li {
    display: flex; align-items: center; gap: 12px; min-width: 0;
    background: var(--paper); border: 3px solid var(--ink); padding: 10px 12px;
  }
  #cloudList li::before, #lib li::before {
    content: ""; width: 14px; height: 14px; flex: none;
    background: var(--tint, var(--red)); box-shadow: 0 0 0 2px var(--ink);
  }
  #cloudList .name, #lib .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; line-height: 1.6; }
  #cloudList .meta, #lib .meta { font: 17px/1.1 var(--term); color: #585868; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #login + #cloudList:not(:empty), #cloudList:empty { margin: 0; }
  #cloudList:not(:empty) { margin-top: 0; }
  #login:not([hidden]) ~ #cloudList { margin-top: 12px; }
  #cloudList button, #lib button { flex: none; }
  #login { display: flex; gap: 10px; flex-wrap: wrap; }
  #login input { flex: 1; min-width: 160px; }
  .muted { font: 18px/1.2 var(--term); color: #585868; margin-top: 8px; min-height: 0; }
  .muted:empty { display: none; }
  #empty { font: 18px/1.2 var(--term); color: #585868; }

  #err { font: 18px/1.2 var(--term); color: var(--red); margin-top: 10px; }
  #err:empty { display: none; }

  /* ---------- player ---------- */
  body.playing { overflow: hidden; background: #000; }
  body.playing #scene { display: none; }
  #player { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #000; }
  #player[hidden], #menu[hidden] { display: none; }
  .bar {
    display: flex; gap: 14px; align-items: center; padding: 8px 12px;
    background: var(--ink); color: var(--paper); border-bottom: 4px solid #30303c;
  }
  .bar button { background: var(--ink); color: var(--paper); border-color: var(--paper); padding: 7px 10px 6px 20px; font-size: 9px; }
  .bar button:hover { background: #30303c; }
  .bar .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; color: var(--gold); }
  .sync { margin-left: auto; font: 17px/1 var(--term); white-space: nowrap; color: #a8b0c0; }
  .sync.ok { color: #88e070; }
  .sync.warn { color: #f8b848; }
  .conflict {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px;
    background: var(--paper); color: var(--ink); border-bottom: 4px solid var(--ink);
    font: 18px/1.2 var(--term);
  }
  .conflict[hidden] { display: none; }
  .conflict span { flex: 1; min-width: 220px; }
  .screen { flex: 1; min-height: 0; display: flex; justify-content: center; background: #000; }
  .screen > div { width: 100%; max-width: 1100px; height: 100%; }

  /* ---------- guide panel (HGSS): follows the player's current map ---------- */
  .screen > #game { flex: 1; min-width: 0; }
  .guide {
    flex: none; width: 300px; overflow-y: auto; background: var(--paper); color: var(--ink);
    border-left: 4px solid var(--ink); box-shadow: inset 3px 0 0 var(--paper), inset 5px 0 0 var(--ink);
    padding: 14px 12px 18px 16px; font: 18px/1.15 var(--term);
  }
  .guide h3 {
    font: 9px/1 var(--pixel); margin: 16px 0 8px; letter-spacing: 1px;
    display: inline-block; background: var(--ink); color: var(--paper); padding: 5px 7px 4px;
  }
  .guide .loc { font: 11px/1.5 var(--pixel); margin: 2px 0 0; }
  .guide .place { color: #585868; }
  .guide .note { color: #585868; margin-top: 10px; }
  .guide .tabs { display: flex; gap: 6px; margin: 0 0 6px; }
  .guide .tabs button { font-size: 8px; padding: 5px 6px 4px; }
  .guide .tabs button::before { content: none; }
  .guide .tabs button.on { background: var(--ink); color: var(--paper); }
  .guide .method { font: 8px/1 var(--pixel); color: #585868; margin: 10px 0 4px; text-transform: uppercase; }
  .guide ul { list-style: none; margin: 0; padding: 0; }
  .guide .mons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .guide .mons li {
    display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; column-gap: 4px;
    border: 2px solid var(--ink); background: var(--paper-2); padding: 0 4px 0 0; overflow: hidden;
  }
  /* HGSS sprites are 80px with lots of empty space around the Pokémon: crop to the middle */
  .guide .mons img { width: 64px; height: 64px; margin: -10px; image-rendering: pixelated; grid-row: span 2; }
  .guide .mons .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .guide .mons .lv { color: #585868; font-size: 16px; }
  .guide .items li { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .guide .items img { width: 24px; height: 24px; image-rendering: pixelated; flex: none; }
  .guide .items .h { color: #585868; font-size: 15px; margin-left: auto; }
  .guide .story { line-height: 1.2; }
  /* the mini map stays in view while you scroll the lists below it */
  .guide .mapwrap { position: sticky; top: -14px; z-index: 1; background: var(--paper); padding-bottom: 6px; margin: 0 -4px; padding-left: 4px; }
  .guide .mapbox { overflow: hidden; position: relative; }
  .guide .me {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    background: #3870e8; box-shadow: 0 0 0 2px #f8f8f0, 0 0 0 3px #181820; pointer-events: none;
    animation: me-blink 1s steps(2) infinite;
  }
  .guide .me[hidden] { display: none; }
  @keyframes me-blink { 50% { opacity: .35; } }
  .guide .minimap { display: block; margin: 0 auto; image-rendering: pixelated; border: 3px solid var(--ink); }
  .guide .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 15px; color: #585868; }
  .guide .key::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 4px;
    background: var(--c); box-shadow: 0 0 0 1px var(--ink);
  }
  .guide .dir { flex: none; width: 48px; color: #585868; }
  .guide .spot { cursor: pointer; }
  .guide .spot.on { background: var(--paper-2); box-shadow: -4px 0 0 var(--gold); }
  .guide .trainers li { padding: 4px 0 6px; border-bottom: 2px solid var(--paper-2); }
  .guide .who { font-size: 18px; }
  .guide .party { display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .guide .pm { display: inline-flex; align-items: center; font-size: 15px; color: #585868; }
  .guide .pm img { width: 40px; height: 40px; margin: -6px -4px -6px -8px; image-rendering: pixelated; }
  .guide .src { margin-top: 18px; font-size: 15px; color: #585868; }
  .guide .src a { color: inherit; }
  /* From 1300px wide the guide splits around the game: next step, map, items and exits on the
     left (#guideL), wild Pokémon and trainers on the right (#guide). */
  #guideL { border-left: 0; border-right: 4px solid var(--ink); box-shadow: inset -3px 0 0 var(--paper), inset -5px 0 0 var(--ink); }
  @media (min-width: 1300px) { .guide { width: 320px; } }
  @media (max-width: 1299px) { #guideL { display: none; } }
  @media (max-width: 899px) { .guide { display: none; } #guideBtn { display: none; } }

  /* Keep EmulatorJS's menu bar visible on desktop, and give it its own strip under the game
     so it never covers the DS touch screen. --ejs-bar is set to the bar's height at game start. */
  #game.ejs_big_screen .ejs_menu_bar_hidden, #game .ejs_big_screen .ejs_menu_bar_hidden {
    opacity: 1 !important; pointer-events: auto !important; transform: none !important;
  }
  #game.ejs_big_screen .ejs_canvas_parent, #game .ejs_big_screen .ejs_canvas_parent {
    height: calc(100% - var(--ejs-bar, 0px));
  }
  #game button::before { content: none; }
  #game button { position: static; text-transform: none; }

  @media (max-width: 480px) {
    .box { padding: 14px 12px 12px; }
    #cloudList li, #lib li { flex-wrap: wrap; }
    #cloudList .name, #lib .name { flex-basis: calc(100% - 30px); }
    .bar .t { display: none; }
  }
</style>
</head>

<script>
  const DATA_PATH = "https://cdn.emulatorjs.org/stable/data/";
  const CORES = { gb: "gb", gbc: "gb", gba: "gba", nds: "nds" };
  const LABEL = { gb: "Game Boy / Color", gba: "Game Boy Advance", nds: "Nintendo DS" };

  // The first 3 letters of an NDS game code (4 bytes at offset 0x0C of the ROM header)
  // identify the game; the 4th is the region. Add more Pokémon games here as you go.
  const NDS_GAMES = {
    IPK: { title: "Pokémon HeartGold", tint: "#d4a017" },
    IPG: { title: "Pokémon SoulSilver", tint: "#aab4c4" },
    ADA: { title: "Pokémon Diamond", tint: "#7aa7e0" },
    APA: { title: "Pokémon Pearl", tint: "#e0a0c0" },
    CPU: { title: "Pokémon Platinum", tint: "#9a9a9a" },
  };
  const REGION = { E: "English", J: "Japan", P: "Europe", D: "Germany", F: "France", I: "Italy", S: "Spain", K: "Korea" };

  // Games stored before the rename have region "USA" saved with them.
  function gameLabel(g) {
    const region = g.region === "USA" ? "English" : g.region;
    return g.title + (region ? " (" + region + ")" : "");
  }

  async function identify(file) {
    if (!/\.nds$/i.test(file.name)) return null;
    const bytes = new Uint8Array(await file.slice(0, 16).arrayBuffer());
    const code = String.fromCharCode(...bytes.slice(12, 16));
    const g = NDS_GAMES[code.slice(0, 3)];
    return g ? { title: g.title, tint: g.tint, region: REGION[code[3]] || "" } : null;
  }

  const $ = (id) => document.getElementById(id);

  function ndsCore() {
    try { return localStorage.getItem("pp_nds_core") || "desmume"; } catch { return "desmume"; }
  }
  const menu = $("menu"), player = $("player"), err = $("err");

  /* ---------- tiny IndexedDB library ---------- */
  const DB = "rom-library", STORE = "roms";
  function openDb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: "id", autoIncrement: true });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function dbDo(mode, fn) {
    const db = await openDb();
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode);
      const req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  const dbAll = () => dbDo("readonly", (s) => s.getAll());
  const dbGet = (id) => dbDo("readonly", (s) => s.get(id));
  const dbPut = (rec) => dbDo("readwrite", (s) => s.put(rec));
  const dbDel = (id) => dbDo("readwrite", (s) => s.delete(id));

  /* ---------- helpers ---------- */
  function detectCore(name, override) {
    if (override && override !== "auto") return override;
    const ext = name.split(".").pop().toLowerCase();
    return CORES[ext] || null;
  }
  const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";

  /* ---------- launch ---------- */
  async function launch(name, blob, core, label) {
    document.body.classList.add("playing");
    menu.hidden = true;
    player.hidden = false;
    $("title").textContent = label || name;

    window.EJS_player = "#game";
    // DS games: use the chosen core. melonDS in this EmulatorJS build can fail to read
    // HeartGold/SoulSilver saves ("A communication error has occurred"); DeSmuME handles them.
    const emuCore = core === "nds" ? ndsCore() : core;
    window.EJS_core = emuCore;

    // Put the right save in place BEFORE the emulator boots (DS games), so the game reads it
    // at power-on like a real cartridge. Returns the fixed save name to use as the game name.
    const saveName = await SaveSync.prepare(name, blob, core, emuCore);
    window.EJS_gameName = saveName || name.replace(/\.[^.]+$/, "");
    if (core === "nds") Guide.prepare(blob);

    window.EJS_gameUrl = new Blob([blob]);
    window.EJS_pathtodata = DATA_PATH;
    window.EJS_startOnLoaded = true;
    window.EJS_color = "#e3350d";
    window.EJS_onGameStart = () => {
      SaveSync.started();
      Guide.started();
      pinMenuBar();
      addSpeedButton();
    };
    // The emulator's Restart is a bare core reset that skips saving and can leave DS games
    // unable to read their save ("A communication error has occurred"). Use ← Library instead.
    window.EJS_Buttons = { restart: false };
    // Let EmulatorJS write the in-game save to its file every 30s (its own supported path);
    // the cloud sync just reads that file.
    window.EJS_defaultOptions = { "save-save-interval": "30" };

    const s = document.createElement("script");
    s.src = DATA_PATH + "loader.js";
    s.onerror = () => {
      player.hidden = true; menu.hidden = false;
      document.body.classList.remove("playing");
      err.textContent = "Couldn't load the emulator from the CDN. Check your internet connection.";
    };
    document.body.appendChild(s);
  }

  // Reserve room under the game for the (always-visible) EmulatorJS menu bar.
  function pinMenuBar() {
    const update = () => {
      const bar = window.EJS_emulator && window.EJS_emulator.elements && window.EJS_emulator.elements.menu;
      if (bar) $("game").style.setProperty("--ejs-bar", bar.offsetHeight + "px");
    };
    update();
    setTimeout(update, 500);
    window.addEventListener("resize", () => setTimeout(update, 100));
  }

  // Speed button in the emulator's menu bar: each click toggles 1x / 2x.
  // Added by hand because custom EJS_Buttons are rejected in EmulatorJS 4.2.3. It drives
  // EmulatorJS's own fast-forward settings, so Settings > Speed Options stay in step.
  // The ratio is only a cap: DeSmuME in the browser has no JIT, so the CPU sets the real top
  // speed. Skipping the drawing of most frames (FRAMESKIP) leaves more of it for the game.
  const SPEEDS = [1, 2];
  const FRAMESKIP = { 1: "0", 2: "1" };
  let speedIdx = 0;
  function addSpeedButton() {
    const emu = window.EJS_emulator, bar = emu && emu.elements && emu.elements.menu;
    if (!bar || $("speedLabel")) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ejs_menu_button";
    btn.innerHTML = '<svg viewBox="0 0 24 24" role="presentation" focusable="false"><text id="speedLabel" ' +
      'x="12" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1x</text></svg>' +
      '<span class="ejs_menu_text">Speed</span>';
    btn.onclick = () => setSpeed(speedIdx + 1);
    bar.insertBefore(btn, bar.querySelector(".ejs_menu_bar_spacer"));
    setSpeed(1); // EmulatorJS remembers fast-forward per game; always boot at 2x
  }
  function setSpeed(i) {
    const emu = window.EJS_emulator;
    speedIdx = i % SPEEDS.length;
    const x = SPEEDS[speedIdx];
    emu.changeSettingOption("desmume_frameskip", FRAMESKIP[x]);
    if (x > 1) {
      emu.changeSettingOption("ff-ratio", x.toFixed(1));
      emu.changeSettingOption("fastForward", "enabled");
    } else {
      emu.changeSettingOption("fastForward", "disabled");
    }
    $("speedLabel").textContent = x + "x";
  }

  // The emulator can't be cleanly torn down, so going back is a page reload.
  // Push any unsynced save first.
  $("back").onclick = async () => {
    $("back").disabled = true;
    await SaveSync.flush().catch(() => {});
    location.reload();
  };

  /* ---------- cloud save sync ---------- */
  // DS games only. The cloud keeps the plain (raw) save; DeSmuME's .dsv footer is stripped on
  // upload, and a cloud save is handed to DeSmuME as a .sav it converts at boot.
  const SaveSync = (() => {
    const INTERVAL_MS = 30000;
    const IDB_NAME = "/data/saves", STORE = "FILE_DATA"; // EmulatorJS/Emscripten IDBFS layout
    let id = null, emuCore = null, lastHash = null, timer = null, busy = false;

    function status(text, cls) {
      const el = $("sync");
      el.textContent = text;
      el.className = "sync" + (cls ? " " + cls : "");
    }
    const syncedKey = () => "pp_synced_" + id;
    function getSynced() { try { return localStorage.getItem(syncedKey()); } catch { return null; } }
    function setSynced(h) { lastHash = h; try { localStorage.setItem(syncedKey(), h); } catch {} }

    async function sha(buf) {
      const d = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
      return [...d].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    const time = (d) => new Date(d).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

    // Same game = same save, whatever the file is called: use the DS game code (e.g. IPGE).
    async function idFor(name, blob) {
      const b = new Uint8Array(await blob.slice(12, 16).arrayBuffer());
      const code = String.fromCharCode(...b);
      if (/^[A-Z0-9]{4}$/.test(code)) return "nds-" + code;
      return "nds-" + (name.replace(/\.[^.]+$/, "").replace(/[^A-Za-z0-9_-]+/g, "_").slice(0, 56) || "game");
    }

    // DeSmuME .dsv = raw save + text/info footer ending in "|-DESMUME SAVE-|".
    const enc = new TextEncoder();
    const TAIL = enc.encode("|-DESMUME SAVE-|"), SNIP = enc.encode("|<--Snip above here");
    function toRaw(bytes) {
      if (!bytes) return null;
      const n = bytes.length;
      if (n < 64 || !TAIL.every((c, i) => bytes[n - 16 + i] === c)) return bytes;
      for (let i = n - 16 - SNIP.length; i >= 0 && i > n - 4096; i--) {
        let ok = true;
        for (let j = 0; j < SNIP.length; j++) if (bytes[i + j] !== SNIP[j]) { ok = false; break; }
        if (ok) return bytes.slice(0, i);
      }
      return bytes;
    }

    /* --- direct access to the emulator's save database (before it starts) --- */
    function idbOpen() {
      return new Promise((resolve, reject) => {
        const r = indexedDB.open(IDB_NAME);
        r.onupgradeneeded = () => {
          const store = r.result.objectStoreNames.contains(STORE)
            ? r.transaction.objectStore(STORE) : r.result.createObjectStore(STORE);
          if (!store.indexNames.contains("timestamp")) store.createIndex("timestamp", "timestamp", { unique: false });
        };
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }
    async function idb(mode, fn) {
      const db = await idbOpen();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE, mode);
          const req = fn(tx.objectStore(STORE));
          tx.oncomplete = () => resolve(req && req.result);
          tx.onerror = () => reject(tx.error);
        });
      } finally { db.close(); }
    }
    const idbGet = (p) => idb("readonly", (s) => s.get(p)).then((v) => (v && v.contents ? new Uint8Array(v.contents) : null));
    const idbPut = (p, bytes) => idb("readwrite", (s) => s.put({ timestamp: new Date(), mode: 33206, contents: bytes }, p));
    const idbDel = (p) => idb("readwrite", (s) => s.delete(p));

    // Each core keeps its saves in its own subfolder of the IDBFS mount.
    const dir = () => "/data/saves/" + (emuCore === "desmume" ? "DeSmuME" : "melonDS");
    const path = (ext) => `${dir()}/${id}.${ext}`;
    const nativeExt = () => (emuCore === "desmume" ? "dsv" : "sav");
    async function ensureDir() {
      const has = await idb("readonly", (s) => s.get(dir()));
      if (!has) await idb("readwrite", (s) => s.put({ timestamp: new Date(), mode: 16893 }, dir()));
    }

    async function readLocalRaw() {
      const native = await idbGet(path(nativeExt())).catch(() => null);
      if (native && native.length) return toRaw(native);
      if (emuCore === "desmume") { // a .sav waiting to be converted counts too
        const pending = await idbGet(path("sav")).catch(() => null);
        if (pending && pending.length) return pending;
      }
      return null;
    }

    async function installLocal(raw) {
      await ensureDir();
      if (emuCore === "desmume") {
        await idbDel(path("dsv")); // DeSmuME imports a .sav only when no .dsv exists
        await idbPut(path("sav"), raw);
      } else {
        await idbPut(path("sav"), raw);
      }
    }

    async function upload(raw, hash, backupOnly) {
      const url = "/api/save?" + (backupOnly ? "backup=1&" : "") + "id=" + encodeURIComponent(id);
      const res = await fetch(url, { method: "PUT", credentials: "same-origin", body: raw });
      if (res.status === 401) { stop(); status("Locked: saves stay in this browser", "warn"); return false; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      if (backupOnly) return true;
      const data = await res.json();
      setSynced(hash);
      status("Saved to cloud " + time(data.uploaded), "ok");
      return true;
    }

    function askConflict(cloudWhen) {
      return new Promise((resolve) => {
        $("conflictMsg").textContent =
          "Two different saves found. Cloud: " + time(cloudWhen) + ". Which one?";
        $("conflict").hidden = false;
        $("useCloud").onclick = () => { $("conflict").hidden = true; resolve("cloud"); };
        $("useLocal").onclick = () => { $("conflict").hidden = true; resolve("local"); };
      });
    }

    // Runs before the emulator loads. Returns the save name to use as EJS_gameName (or null).
    async function prepare(name, blob, system, core) {
      if (system !== "nds") { id = null; status(""); return null; }
      emuCore = core;
      id = await idFor(name, blob);
      lastHash = getSynced();
      status("Checking cloud save…");

      let res;
      try { res = await fetch("/api/save?id=" + encodeURIComponent(id), { credentials: "same-origin", cache: "no-store" }); }
      catch { status("Offline: saves stay in this browser", "warn"); return id; }
      if (res.status === 401) { status("Locked: unlock My games to sync saves", "warn"); return id; }
      const isJson = (res.headers.get("content-type") || "").includes("json");
      if (res.status === 404 && !isJson) { status("Cloud saves only work on the deployed site", "warn"); id = null; return null; }

      const local = await readLocalRaw();
      const localHash = local ? await sha(local) : null;

      if (res.status === 404) {
        if (localHash) await upload(local, localHash).catch(() => status("Save sync failed, will retry", "warn"));
        else status("No save yet. It will sync after you save in-game.");
        return id;
      }
      if (!res.ok) { status("Save sync failed", "warn"); return id; }

      const cloud = new Uint8Array(await res.arrayBuffer());
      const cloudHash = await sha(cloud);
      const cloudWhen = res.headers.get("x-save-uploaded");

      let choice;
      if (localHash === cloudHash) choice = "same";
      else if (!localHash || localHash === lastHash) choice = "cloud";
      else choice = await askConflict(cloudWhen);

      if (choice === "cloud") {
        if (localHash && localHash !== lastHash) await upload(local, localHash, true).catch(() => {});
        await installLocal(cloud);
        setSynced(cloudHash);
        status("Loaded cloud save from " + time(cloudWhen), "ok");
      } else if (choice === "local") {
        await upload(local, localHash).catch(() => status("Save sync failed, will retry", "warn"));
      } else {
        setSynced(cloudHash);
        status("Save in sync (" + time(cloudWhen) + ")", "ok");
      }
      return id;
    }

    function gm() { return window.EJS_emulator && window.EJS_emulator.gameManager; }

    async function tick(flush) {
      if (!id || busy) return;
      const g = gm();
      if (!g || !g.FS) return;
      busy = true;
      try {
        let bytes = null;
        try { bytes = g.getSaveFile(flush); } catch {}
        const raw = toRaw(bytes);
        if (!raw || !raw.length) return;
        const h = await sha(raw);
        if (h === lastHash) return;
        status("Syncing save…");
        await upload(raw, h);
      } catch (e) {
        status("Save sync failed, will retry", "warn");
        console.warn("save sync", e);
      } finally { busy = false; }
    }

    function stop() { if (timer) clearInterval(timer); timer = null; }

    // Called once the game is running: sanity-check the save path, then sync periodically.
    function started() {
      if (!id) return;
      const g = gm();
      try {
        const p = g.getSaveFilePath();
        if (p !== path(nativeExt())) {
          console.warn("Unexpected save path", p, "expected", path(nativeExt()));
          status("Save path mismatch (" + p + "): cloud sync paused", "warn");
          id = null;
          return;
        }
      } catch {}
      stop();
      timer = setInterval(() => tick(false), INTERVAL_MS); // passive read, no forced flush
    }

    document.addEventListener("visibilitychange", () => { if (document.hidden) tick(false); });

    return { prepare, started, flush: () => tick(true) };
  })();

  /* ---------- guide panel (HeartGold / SoulSilver) ---------- */
  // Shows the wild Pokémon, items and trainers of the map the player is on. The game keeps its
  // live position inside its save data in DS RAM (general block +0x1234 = current map id, the
  // same layout as the save file). The page finds that block in the emulator's memory by
  // looking for the trainer name + ID from the save file, then reads the map id every second.
  // Map data comes from guide/hgss.json, built by tools/guide_data.py.
  const Guide = (() => {
    const GAMES = { IPK: "hg", IPG: "ss" };
    const SLOTS = [0, 0x40000];            // HGSS keeps two 256 KB save slots
    const TRAINER = 0x64, MAP = 0x1234;    // offsets in the general block
    const RAM_SIZE = 0x400000, HEADER_IN_RAM = 0x3FFE00; // boot copies the ROM header to 0x027FFE00
    const SPRITE = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/heartgold-soulsilver/";
    const ITEM_ICON = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/";
    const METHODS = { surf: "Surfing", rock: "Rock Smash", oldrod: "Old Rod", goodrod: "Good Rod", superrod: "Super Rod" };
    let ver = null, header = null, data = null, tiles = {}, shown = null, timer = null, scans = 0, tod = null, badges = null;
    const el = () => $("guide");
    const wide = matchMedia("(min-width: 1300px)");

    function visible() { try { return localStorage.getItem("pp_guide") !== "off"; } catch { return true; } }
    function setVisible(on) {
      try { localStorage.setItem("pp_guide", on ? "on" : "off"); } catch {}
      el().hidden = !on;
      $("guideL").hidden = !on || !$("guideL").firstChild;
      setTimeout(() => window.dispatchEvent(new Event("resize")), 0); // let the emulator refit
    }

    async function prepare(blob) {
      const h = new Uint8Array(await blob.slice(0, 16).arrayBuffer());
      ver = GAMES[String.fromCharCode(...h.slice(12, 15))] || null;
      if (!ver) return;
      header = h;
      $("guideBtn").hidden = false;
      $("guideBtn").onclick = () => setVisible(el().hidden);
      el().hidden = !visible();
      wide.addEventListener("change", () => { if (shown != null) render(shown); });
      render(null, "Loading…");
      Terrain.open(blob).then(() => { if (shown != null) render(shown); });
      try { ({ maps: data, tiles } = await (await fetch("guide/hgss.json")).json()); }
      catch { render(null, "Couldn't load the guide data."); ver = null; }
    }

    function started() {
      if (!ver) return;
      render(null, "Waiting for the game…");
      timer = setInterval(poll, 1000);
      setInterval(follow, 200);
    }

    // The player's map object in DS RAM: active (flag bit 0), id 255 (player) and movement 1 as the
    // game creates it, current tile at +0x64/+0x6C and a fixed-point position (1 tile = 0x10000) at +0x70/+0x78
    // that moves smoothly between tiles. It is found by scanning DS RAM and checked on every read.
    let me = -1, meScan = 0;
    function playerAt(h, o) {
      if (o < 0 || o + 0x7c > h.length) return null;
      const v = new DataView(h.buffer, h.byteOffset + o, 0x7c);
      if (!(v.getUint32(0, true) & 1) || v.getUint32(8, true) !== 255 || v.getUint32(0x14, true) !== 1) return null;
      const cx = v.getUint32(0x64, true), cz = v.getUint32(0x6c, true);
      const x = v.getInt32(0x70, true) / 0x10000, z = v.getInt32(0x78, true) / 0x10000;
      if (cx > 4096 || cz > 4096 || Math.abs(x - cx - 0.5) > 1.5 || Math.abs(z - cz - 0.5) > 1.5) return null;
      return [x, z];
    }
    function player(h) {
      let p = playerAt(h, me);
      if (p || ram == null || meScan++ % 5) return p;
      const u32 = new Uint32Array(h.buffer, h.byteOffset + ram, RAM_SIZE >> 2);
      for (let i = 2; i < u32.length; i++) {
        if (u32[i] === 255 && (p = playerAt(h, ram + (i - 2) * 4))) { me = ram + (i - 2) * 4; return p; }
      }
      me = -1;
      return null;
    }
    function follow() {
      const h = heap(), dot = document.querySelector(".guide .me"), c = dot && dot.parentElement.querySelector("canvas");
      if (!h || !dot || !c || !c.geo) return;
      const p = player(h), g = c.geo;
      const inside = p && p[0] >= g.x0 && p[1] >= g.z0 && p[0] < g.x0 + g.w && p[1] < g.z0 + g.h;
      dot.hidden = !inside;
      if (inside) {
        dot.style.left = c.offsetLeft + c.clientLeft + (p[0] - g.x0) * g.k + "px";
        dot.style.top = c.offsetTop + c.clientTop + (p[1] - g.z0) * g.k + "px";
      }
    }

    function heap() {
      const m = window.EJS_emulator && window.EJS_emulator.gameManager && window.EJS_emulator.gameManager.Module;
      return m && m.HEAPU8;
    }

    // The newest save slot's general block. Its last 0x14 bytes are a footer: save counters
    // (major, minor) at -0x14 / -0x10 and the magic at -8.
    const GENERAL = 0xF628, MAGIC = 0x20060623;
    function general() {
      let save = null;
      try { save = window.EJS_emulator.gameManager.getSaveFile(false); } catch {}
      if (!save || save.length < 0x80000) return null;
      const u32 = (o) => (save[o] | save[o + 1] << 8 | save[o + 2] << 16 | save[o + 3] << 24) >>> 0;
      let best = null, bestKey = -1;
      for (const slot of SLOTS) {
        const end = slot + GENERAL;
        if (u32(end - 8) !== MAGIC || u32(end - 0x14) === 0xffffffff) continue;
        const key = u32(end - 0x14) * 2 ** 32 + u32(end - 0x10);
        if (key > bestKey) { bestKey = key; best = save.slice(slot, end); }
      }
      return best;
    }
    // Trainer name + ID (20 bytes).
    function signature(gen) {
      const sig = gen.slice(TRAINER, TRAINER + 0x14);
      const id = sig[16] | sig[17] << 8 | sig[18] << 16 | sig[19] << 24;
      return sig[0] !== 0xff && (sig[0] | sig[1]) && id ? sig : null;
    }

    function matches(h, at, bytes) {
      if (at < 0 || at + bytes.length > h.length) return false;
      for (let i = 0; i < bytes.length; i++) if (h[at + i] !== bytes[i]) return false;
      return true;
    }
    // Every 4-byte aligned spot in the heap where `bytes` occurs, using the word at keyAt as a key.
    function findAll(h, bytes, keyAt) {
      const u32 = new Uint32Array(h.buffer, h.byteOffset, h.length >> 2);
      const key = (bytes[keyAt] | bytes[keyAt + 1] << 8 | bytes[keyAt + 2] << 16 | bytes[keyAt + 3] << 24) >>> 0;
      const out = [];
      for (let i = 0; i < u32.length; i++) {
        if (u32[i] === key && matches(h, i * 4 - keyAt, bytes)) out.push(i * 4 - keyAt);
      }
      return out;
    }
    // Share of the save's non-zero general-block bytes that are the same at heap offset b. The game's
    // live copy is mostly unchanged since the last save; other copies of the trainer card are not.
    function score(h, b, gen) {
      if (b < 0 || b + GENERAL > h.length) return 0;
      let same = 0, n = 0;
      for (let i = 0; i < GENERAL; i += 4) if (gen[i]) { n++; if (h[b + i] === gen[i]) same++; }
      return n ? same / n : 0;
    }

    // The emulator also holds a copy of the save file (the cartridge's memory), which only
    // changes when you save. Use the copy that sits inside DS main RAM, found via the ROM header
    // the console copies to the end of RAM at boot. If that header can't be found, follow every
    // copy and show whichever changed last.
    let debug = "", ram;
    function scan() {
      const h = heap(), gen = general(), sig = gen && signature(gen);
      if (!h || !sig) { debug = gen ? "no trainer in save" : "no save"; return []; }
      const all = findAll(h, sig, 16).map((t) => t - TRAINER).map((b) => [b, score(h, b, gen)]);
      const found = all.filter(([b, sc]) => sc > 0.5 && mapAt(h, b) > 1 && mapAt(h, b) in data).map(([b]) => b);
      const rams = findAll(h, header, 12).map((x) => x - HEADER_IN_RAM);
      const inRam = found.filter((b) => rams.some((r) => b >= r && b < r + RAM_SIZE));
      // e.g. "3 RAM · 97%:33 r, 12%:0" = match score : map id, r = inside DS RAM
      debug = rams.length + " RAM · " + (all.map(([b, sc]) => Math.round(sc * 100) + "%:" + mapAt(h, b) +
        (rams.some((r) => b >= r && b < r + RAM_SIZE) ? " r" : "")).join(", ") || "no match");
      ram = rams.find((r) => inRam.some((b) => b >= r && b < r + RAM_SIZE));
      return rams.length ? inRam : found;
    }

    function mapAt(h, b) {
      const a = b + MAP;
      if (a < 0 || a + 4 > h.length) return -1;
      return (h[a] | h[a + 1] << 8 | h[a + 2] << 16 | h[a + 3] << 24) >>> 0;
    }

    let cands = [], last = [], pick = 0;
    function poll() {
      const h = heap();
      if (!h || !data) return;
      if (!cands.length) {
        if (scans++ % 5) return; // full scan every 5s until the save is loaded in game
        cands = scan(); last = cands.map((b) => mapAt(h, b)); pick = 0;
        if (!cands.length) {
          render(null, general() ? "Waiting for the game…" : "Save in-game once to start the guide.");
          return;
        }
      }
      const ids = cands.map((b) => mapAt(h, b));
      ids.forEach((v, i) => { if (v !== last[i]) pick = i; });
      last = ids;
      const id = ids[pick];
      if (!(id in data) || id <= 1) { cands = []; return; }
      const t = timeOfDay(), b = cands[pick] + TRAINER;
      const bd = [h[b + 0x1a], h[b + 0x1f]]; // Johto and Kanto badge bits
      const changed = !badges || bd[0] !== badges[0] || bd[1] !== badges[1];
      if (id !== shown) highlight = null;
      if (id !== shown || t !== tod || changed) { tod = t; badges = bd; render(id); }
    }

    // HGSS: morning 4-10, day 10-20, night 20-4 (the game uses the console clock).
    function timeOfDay() {
      const h = new Date().getHours();
      return h >= 4 && h < 10 ? "morn" : h >= 10 && h < 20 ? "day" : "nite";
    }

    const node = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };
    const slug = (name) => name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[.'’]/g, "").replace(/\s+/g, "-");

    function monList(rows) {
      const ul = node("ul", "mons");
      for (const [dex, name, lo, hi, pct] of rows) {
        const li = node("li");
        const img = node("img");
        img.src = SPRITE + dex + ".png"; img.alt = ""; img.loading = "lazy";
        img.onerror = () => { img.style.visibility = "hidden"; };
        li.append(img, node("span", "n", name),
          node("span", "lv", "Lv" + (lo === hi ? lo : lo + "-" + hi) + (pct != null ? "  " + pct + "%" : "")));
        ul.append(li);
      }
      return ul;
    }

    /* --- terrain for the mini map, read from the ROM in this browser (never uploaded) --- */
    // NitroFS: FNT at header 0x40, FAT at 0x48. Land data is the NARC at a/0/6/5; each member
    // holds a 32x32 grid of u16 terrain attributes after its header (low byte = behaviour, bit 15 = wall).
    const Terrain = (() => {
      let rom = null, narc = null;
      const cache = new Map();
      const read = async (off, len) => new DataView(await rom.slice(off, off + len).arrayBuffer());
      async function fileOffset(path) {
        const hd = await read(0x40, 0x10);
        const fnt = hd.getUint32(0, true), fntSize = hd.getUint32(4, true), fat = hd.getUint32(8, true);
        const t = new Uint8Array(await rom.slice(fnt, fnt + fntSize).arrayBuffer());
        const dv = new DataView(t.buffer);
        let dir = 0;
        for (const [i, part] of path.split("/").entries()) {
          let p = dv.getUint32(dir * 8, true), id = dv.getUint16(dir * 8 + 4, true), next = -1;
          for (;;) {
            const len = t[p++];
            if (!len) break;
            const name = String.fromCharCode(...t.subarray(p, p + (len & 0x7f)));
            p += len & 0x7f;
            if (len & 0x80) {
              const sub = dv.getUint16(p, true) & 0xfff; p += 2;
              if (name === part && i < path.split("/").length - 1) { next = sub; break; }
            } else if (name === part) { next = id; break; }
            else id++;
          }
          if (next < 0) return null;
          if (i === path.split("/").length - 1) {
            const f = await read(fat + next * 8, 8);
            return [f.getUint32(0, true), f.getUint32(4, true)];
          }
          dir = next;
        }
        return null;
      }
      async function open(blob) {
        rom = blob; narc = null;
        try {
          const f = await fileOffset("a/0/6/5");
          if (!f) return;
          const h = await read(f[0], 0x20);
          if (h.getUint32(0, true) !== 0x4352414e) return; // "NARC"
          const btaf = f[0] + h.getUint16(0x0c, true);
          const b = await read(btaf, 12);
          const size = b.getUint32(4, true), count = b.getUint16(8, true);
          const table = await read(btaf + 12, count * 8);
          const btnf = btaf + size;
          const gmif = btnf + (await read(btnf, 8)).getUint32(4, true);
          narc = { table, count, data: gmif + 8 };
        } catch (e) { console.warn("guide terrain", e); }
      }
      async function block(id) {
        if (!narc || id >= narc.count) return null;
        if (!cache.has(id)) {
          const start = narc.data + narc.table.getUint32(id * 8, true);
          // Header: four section sizes, then (HGSS) a background-sound section: 0x1234, its length, data.
          // The terrain attributes come right after it.
          cache.set(id, read(start, 0x14).then((hd) => {
            const skip = hd.getUint16(0x10, true) === 0x1234 ? hd.getUint16(0x12, true) : 0;
            return read(start + 0x14 + skip, 0x800);
          }).then((v) => new Uint16Array(v.buffer.slice(v.byteOffset, v.byteOffset + 0x800))).catch(() => null));
        }
        return cache.get(id);
      }
      return { open, block, ready: () => !!narc };
    })();

    // Mini map colours by terrain class (see "tiles" in hgss.json).
    const TILE = { 0: "#f0f0e0", 1: "#78c050", 2: "#5898f0", 3: "#b07840", 4: "#d83820", 5: "#e8d098" };
    const WALL = "#4c6450";

    async function drawMap(m, canvas, highlight) {
      const blocks = (m.blocks || []).map((b) => [...b, false]).concat((m.near || []).map((b) => [...b, true]));
      if (!blocks.length) return false;
      const bx0 = Math.min(...blocks.map((b) => b[0])), bz0 = Math.min(...blocks.map((b) => b[1]));
      const bw = Math.max(...blocks.map((b) => b[0])) - bx0 + 1, bh = Math.max(...blocks.map((b) => b[1])) - bz0 + 1;
      // Fill the column's width, up to about half the screen's height; draw at a whole number of
      // pixels per tile (at least the shown size) and let CSS scale it with crisp pixels.
      const boxW = (canvas.parentElement && canvas.parentElement.clientWidth || 268) - 6;
      const boxH = Math.max(260, Math.min(560, innerHeight * 0.55));
      const fit = Math.min(boxW / (bw * 32), boxH / (bh * 32));
      const s = Math.max(1, Math.min(8, Math.ceil(fit)));
      canvas.width = bw * 32 * s; canvas.height = bh * 32 * s;
      canvas.style.width = Math.floor(bw * 32 * fit) + "px";
      canvas.style.height = Math.floor(bh * 32 * fit) + "px";
      canvas.geo = { x0: bx0 * 32, z0: bz0 * 32, w: bw * 32, h: bh * 32, k: Math.floor(bw * 32 * fit) / (bw * 32) };
      const c = canvas.getContext("2d");
      c.fillStyle = "#181820"; c.fillRect(0, 0, canvas.width, canvas.height);
      let drew = false;
      for (const [bx, bz, land, dim] of blocks) {
        const t = await Terrain.block(land);
        if (!t) continue;
        drew = true;
        const ox = (bx - bx0) * 32 * s, oz = (bz - bz0) * 32 * s;
        for (let i = 0; i < 1024; i++) {
          const v = t[i];
          c.fillStyle = v & 0x8000 ? WALL : TILE[tiles[v & 0xff] || 0];
          c.fillRect(ox + (i & 31) * s, oz + (i >> 5) * s, s, s);
        }
        if (dim) { c.fillStyle = "rgba(24,24,32,.45)"; c.fillRect(ox, oz, 32 * s, 32 * s); }
      }
      if (!drew) return false;
      const dot = (x, z, fill, r, ring) => {
        const px = (x - bx0 * 32) * s + s / 2, pz = (z - bz0 * 32) * s + s / 2;
        c.fillStyle = "#181820"; c.fillRect(px - r - 1, pz - r - 1, 2 * r + 2, 2 * r + 2);
        c.fillStyle = fill; c.fillRect(px - r, pz - r, 2 * r, 2 * r);
        if (ring) { const o = r + Math.max(4, s); c.strokeStyle = "#e0b030"; c.lineWidth = Math.max(2, s / 2); c.strokeRect(px - o, pz - o, 2 * o, 2 * o); }
      };
      const r = Math.max(2, s);
      for (const [x, z] of m.warps || []) dot(x, z, "#f8f8f0", r - 1);
      (m.trainers || []).forEach(([x, z], i) => dot(x, z, "#585868", r, highlight === "t" + i));
      (m.hidden || []).forEach(([x, z], i) => dot(x, z, "#e0b030", r, highlight === "h" + i));
      (m.items || []).forEach(([x, z], i) => dot(x, z, "#d83820", r, highlight === "i" + i));
      return true;
    }

    // Next step of the story by badges earned (Johto byte, then Kanto byte; bit 0 = first badge).
    const JOHTO = [
      "Get your first Pokémon from Prof. Elm, run his errand to Mr. Pokémon's house on Route 30, then go north through Route 31 to Violet City. Gym: Falkner (Flying).",
      "Go south from Violet City down Route 32, through Union Cave and Route 33 to Azalea Town. Clear Team Rocket out of Slowpoke Well. Gym: Bugsy (Bug).",
      "Go west into Ilex Forest (herd the charcoal maker's lost Farfetch'd back to get HM01 Cut), then north on Route 34 to Goldenrod City. Gym: Whitney (Normal).",
      "Go north on Route 35 past the National Park to Route 36. The odd tree there needs the SquirtBottle from the Goldenrod Flower Shop. Then Route 37 to Ecruteak City. Gym: Morty (Ghost).",
      "Learn Surf at the Ecruteak Dance Theater, head west to Olivine City and check the Lighthouse, then surf Routes 40-41 to Cianwood City. Gym: Chuck (Fighting). Get the medicine at the pharmacy.",
      "Take the medicine to the sick Ampharos at the top of the Olivine Lighthouse. Gym: Jasmine (Steel).",
      "Go east from Ecruteak on Route 42 to Mahogany Town, north to the Lake of Rage, then clear Team Rocket's hideout under the Mahogany shop. Gym: Pryce (Ice).",
      "Free the Goldenrod Radio Tower from Team Rocket, then go east from Mahogany on Route 44 through the Ice Path to Blackthorn City. Gym: Clair (Dragon), then her test in the Dragon's Den.",
    ];
    const KANTO = [
      ["Brock", "Pewter City"], ["Misty", "Cerulean City"], ["Lt. Surge", "Vermilion City"], ["Erika", "Celadon City"],
      ["Janine", "Fuchsia City"], ["Sabrina", "Saffron City"], ["Blaine", "Seafoam Islands"], ["Blue", "Viridian City (last)"],
    ];
    function nextStep(johto, kanto) {
      for (let i = 0; i < 8; i++) if (!(johto >> i & 1)) return JOHTO[i];
      if (!kanto) return "On to the Pokémon League: from New Bark Town surf east on Route 27, climb Tohjo Falls (Waterfall, from the Ice Path) and take Route 26 and Victory Road to Indigo Plateau. After that, take the S.S. Aqua from Olivine to Kanto.";
      const left = KANTO.filter((k, i) => !(kanto >> i & 1));
      if (!left.length) return "All 16 badges! Talk to Prof. Oak in Pallet Town, then go west from Viridian City on Routes 22 and 28 to Mt. Silver.";
      return "Kanto badges left: " + left.map(([who, where]) => who + " (" + where + ")").join(", ") + ".";
    }

    let pickedTime = null, highlight = null;
    function render(id, msg) {
      shown = id;
      const g = el(), gl = $("guideL");
      g.replaceChildren(); gl.replaceChildren();
      gl.hidden = true;
      if (id == null) {
        g.append(node("h3", null, "GUIDE"), node("div", "note", msg || ""), node("div", "src", debug));
        return;
      }
      const m = data[id];
      // main: next step, map, items, exits. side: wild Pokémon, trainers. On wide screens main
      // goes in its own panel on the left of the game.
      const main = node("div", "gcol"), side = node("div", "gcol");
      if (wide.matches) { gl.append(main); gl.hidden = g.hidden; } else g.append(main);
      g.append(side);
      main.append(node("div", "loc", m.name || "???"));
      if (m.place) main.append(node("div", "place", m.place));

      if (badges) main.append(node("h3", null, "NEXT"), node("div", "story", nextStep(badges[0], badges[1])));

      let canvas = null;
      if (m.blocks && Terrain.ready()) {
        canvas = node("canvas", "minimap");
        canvas.setAttribute("aria-hidden", "true");
        const box = node("div", "mapbox");
        const dot = node("div", "me");
        dot.hidden = true;
        box.append(canvas, dot);
        const legend = node("div", "legend");
        for (const [color, label] of [["#3870e8", "you"], ["#d83820", "item"], ["#e0b030", "hidden"], ["#585868", "trainer"], ["#f8f8f0", "door"]]) {
          const k = node("span", "key", label);
          k.style.setProperty("--c", color);
          legend.append(k);
        }
        const wrap = node("div", "mapwrap");
        wrap.append(node("h3", null, "MAP"), box, legend);
        main.append(wrap);
        drawMap(m, canvas, highlight).then((ok) => { if (!ok) { wrap.remove(); canvas = null; } });
      }

      const enc = m[ver];
      if (enc) {
        side.append(node("h3", null, "WILD"));
        if (enc.grass_morn) {
          const t = pickedTime || tod;
          const tabs = node("div", "tabs");
          for (const [k, label] of [["morn", "MORN"], ["day", "DAY"], ["nite", "NITE"]]) {
            const b = node("button", k === t ? "on" : "", label);
            b.onclick = () => { pickedTime = k === tod ? null : k; render(id); };
            tabs.append(b);
          }
          side.append(node("div", "method", "Grass"), tabs, monList(enc["grass_" + t]));
        }
        for (const k in METHODS) if (enc[k]) side.append(node("div", "method", METHODS[k]), monList(enc[k]));
      }

      // Hover or tap a row to ring its spot on the mini map.
      const spot = (li, key) => {
        li.classList.add("spot");
        li.dataset.spot = key;
        if (highlight === key) li.classList.add("on");
        li.onmouseenter = li.onclick = () => {
          if (highlight === key || !canvas) return;
          highlight = key;
          for (const x of document.querySelectorAll(".guide .spot")) x.classList.toggle("on", x.dataset.spot === key);
          drawMap(m, canvas, key);
        };
      };

      const items = (m.items || []).map((it, i) => [it[2], false, "i" + i]).concat((m.hidden || []).map((it, i) => [it[2], true, "h" + i]));
      if (items.length) {
        main.append(node("h3", null, "ITEMS"));
        const ul = node("ul", "items");
        for (const [name, hidden, key] of items) {
          const li = node("li");
          const img = node("img");
          img.src = ITEM_ICON + slug(name.replace(/^([TH]M)\d+ .*/, (x, tm) => tm.toLowerCase() + "-normal")) + ".png";
          img.alt = ""; img.loading = "lazy";
          img.onerror = () => { img.style.visibility = "hidden"; };
          li.append(img, node("span", null, name));
          if (hidden) li.append(node("span", "h", "hidden"));
          spot(li, key);
          ul.append(li);
        }
        main.append(ul);
      }

      const exits = (m.exits || []).map(([d, to]) => [{ N: "North", S: "South", E: "East", W: "West" }[d], to])
        .concat((m.warps || []).map(([, , to]) => ["Door", to]));
      if (exits.length) {
        main.append(node("h3", null, "EXITS"));
        const ul = node("ul", "items");
        for (const [d, to] of exits) {
          const t = data[to];
          if (!t) continue;
          const li = node("li");
          const label = t.name === m.name ? t.place || t.name : t.name + (t.place ? " · " + t.place : "");
          li.append(node("span", "dir", d), node("span", null, label));
          ul.append(li);
        }
        main.append(ul);
      }

      if (m.trainers) {
        side.append(node("h3", null, "TRAINERS"));
        const ul = node("ul", "trainers");
        m.trainers.forEach(([, , who, party], i) => {
          const li = node("li");
          li.append(node("div", "who", who));
          const p = node("div", "party");
          for (const [dex, name, lv] of party) {
            const mon = node("span", "pm");
            const img = node("img");
            img.src = SPRITE + dex + ".png"; img.alt = name; img.title = name; img.loading = "lazy";
            img.onerror = () => { img.style.visibility = "hidden"; };
            mon.append(img, node("span", null, name + " " + lv));
            p.append(mon);
          }
          li.append(p);
          spot(li, "t" + i);
          ul.append(li);
        });
        side.append(ul);
      }
      if (!enc && !m.trainers) side.append(node("div", "note", "No wild Pokémon or trainers here."));

      const src = node("div", "src");
      const a = node("a", null, "More on Bulbapedia");
      a.href = "https://bulbapedia.bulbagarden.net/w/index.php?search=" + encodeURIComponent(m.name);
      a.target = "_blank"; a.rel = "noopener";
      src.append(a, node("div", null, "Map " + id + " · " + debug));
      main.append(src);
    }

    return { prepare, started };
  })();

  /* ---------- launching a game file (from the cloud list) ---------- */
  async function handleFile(file) {
    err.textContent = "";
    if (!file) return;
    const core = detectCore(file.name, "auto");
    if (!core) {
      err.textContent = "UNKNOWN SYSTEM.";
      return;
    }
    const game = await identify(file);
    const label = game ? gameLabel(game) : file.name;
    // Keep a copy in this browser's STORED list so the next launch doesn't re-download it.
    try { await dbPut({ name: file.name, core, size: file.size, added: Date.now(), blob: file, game }); }
    catch (e) { console.warn("Could not save to library:", e); }
    launch(file.name, file, core, label);
  }


  /* ---------- library list ---------- */
  async function renderLibrary() {
    const ul = $("lib");
    ul.innerHTML = "";
    let items = [];
    try { items = await dbAll(); } catch (e) { console.warn(e); }
    items.sort((a, b) => b.added - a.added);
    $("empty").hidden = items.length > 0;

    for (const it of items) {
      const li = document.createElement("li");

      const g = it.game;
      const label = g ? gameLabel(g) : it.name;
      if (g) li.style.setProperty("--tint", g.tint);

      const info = document.createElement("div");
      info.className = "name";
      info.textContent = label;

      const play = document.createElement("button");
      play.className = "primary";
      play.textContent = "Play";
      play.onclick = async () => {
        const rec = await dbGet(it.id);
        if (rec) launch(rec.name, rec.blob, rec.core, label);
      };

      const del = document.createElement("button");
      del.textContent = "Remove";
      del.onclick = async () => {
        if (!confirm("Are you sure you want to remove " + label + "?")) return;
        await dbDel(it.id);
        renderLibrary();
      };

      li.append(info, play, del);
      ul.appendChild(li);
    }
    hideStoredPlay();
  }
  renderLibrary();

  /* ---------- cloud games (private R2 bucket, password protected) ---------- */
  const cloudList = $("cloudList"), cloudMsg = $("cloudMsg"), loginForm = $("login"), logoutBtn = $("logout");

  function showLogin(msg) {
    loginForm.hidden = false; logoutBtn.hidden = true;
    cloudList.innerHTML = "";
    cloudMsg.textContent = msg || "";
  }

  async function loadCloud() {
    let res;
    try { res = await fetch("/api/roms", { credentials: "same-origin" }); }
    catch { cloudMsg.textContent = ""; return; }
    if (res.status === 401) return showLogin();
    if (res.status === 404) { cloudMsg.textContent = ""; return; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { cloudMsg.textContent = data.error || "Couldn't load your games."; return; }

    loginForm.hidden = true; logoutBtn.hidden = false;
    cloudList.innerHTML = "";
    cloudMsg.textContent = data.roms.length ? "" : "NO GAMES IN STORAGE.";

    for (const r of data.roms) {
      const li = document.createElement("li");
      const info = document.createElement("div");
      info.className = "name";
      info.textContent = r.key.replace(/\.[^.]+$/, "");

      const play = document.createElement("button");
      play.className = "primary";
      play.textContent = "Play";
      play.onclick = () => playCloud(r, play);
      play.hidden = true;
      li.rom = r;

      li.append(info, play);
      cloudList.appendChild(li);

      // Show the proper game name from the header code the server read (no download needed).
      const known = r.code && NDS_GAMES[r.code.slice(0, 3)];
      if (known) {
        info.firstChild.textContent = known.title + (REGION[r.code[3]] ? " (" + REGION[r.code[3]] + ")" : "");
        li.style.setProperty("--tint", known.tint);
      } else cachedFor(r).then((rec) => {
        if (rec && rec.game) {
          info.firstChild.textContent = gameLabel(rec.game);
          li.style.setProperty("--tint", rec.game.tint);
        }
      });
    }
    hideStoredPlay();
  }

  // A game already in STORED is played from there, so its Play button here is hidden.
  async function hideStoredPlay() {
    let items = [];
    try { items = await dbAll(); } catch {}
    for (const li of cloudList.children) {
      const r = li.rom;
      if (r) li.querySelector("button").hidden = items.some((x) => x.name === r.key && x.size === r.size);
    }
  }

  async function cachedFor(r) {
    try { return (await dbAll()).find((x) => x.name === r.key && x.size === r.size) || null; }
    catch { return null; }
  }

  async function playCloud(r, btn) {
    err.textContent = "";
    const cached = await cachedFor(r);
    if (cached) {
      const label = cached.game ? gameLabel(cached.game) : cached.name;
      return launch(cached.name, cached.blob, cached.core, label);
    }

    btn.disabled = true;
    btn.textContent = "Downloading…";
    try {
      const res = await fetch("/api/romfile?key=" + encodeURIComponent(r.key), { credentials: "same-origin" });
      if (res.status === 401) { btn.disabled = false; btn.textContent = "Play"; return showLogin("SESSION EXPIRED."); }
      if (!res.ok) throw new Error("HTTP " + res.status);
      const blob = await res.blob();
      const file = new File([blob], r.key.split("/").pop());
      // Cache it locally so next time it starts instantly (keeps the "Keep in library" choice).
      await handleFile(file);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Play";
      cloudMsg.textContent = "Download failed (" + e.message + "). Try again.";
    }
  }

  loginForm.onsubmit = async (e) => {
    e.preventDefault();
    cloudMsg.textContent = "Checking…";
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ password: $("pw").value }),
    }).catch(() => null);
    $("pw").value = "";
    if (!res) { cloudMsg.textContent = "Couldn't reach the site."; return; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { cloudMsg.textContent = data.error || "Sign-in failed."; return; }
    loadCloud();
  };

  logoutBtn.onclick = async () => {
    await fetch("/api/logout", { method: "POST", credentials: "same-origin" }).catch(() => {});
    showLogin("");
  };

  loadCloud();

  /* ---------- Gen 2 clock (MORN / DAY / NITE) ---------- */
  function tickClock() {
    const d = new Date(), h = d.getHours();
    const period = h >= 4 && h < 10 ? "morn" : h >= 10 && h < 18 ? "day" : "nite";
    document.documentElement.dataset.time = period;
    const hh = ((h + 11) % 12) + 1, mm = String(d.getMinutes()).padStart(2, "0");
    $("clock").textContent = period.toUpperCase() + "  " + hh + ":" + mm + (h < 12 ? " AM" : " PM");
  }
  tickClock();
  setInterval(tickClock, 30000);
</script>
</body>
</html>
