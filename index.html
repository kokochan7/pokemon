<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenny's Pokémon Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script>
  // Gen 2 clock: MORN 4-10, DAY 10-18, NITE 18-4
  (function () {
    const h = new Date().getHours();
    document.documentElement.dataset.time = h >= 4 && h < 10 ? "morn" : h >= 10 && h < 18 ? "day" : "nite";
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script>fetch("scene.svg").then((r) => r.ok && r.text()).then((t) => t && document.body.insertAdjacentHTML("afterbegin", t));</script>

<main id="menu">
  <header class="title">
    <div class="logo"><span class="l2">KENNY'S</span><span class="l1">POKéMON</span><span class="l2">PLAYER</span></div>
    <div><span class="clock" id="clock"></span></div>
  </header>

  <section class="box">
    <h2>GAMES</h2>
    <div id="cloud">
      <form id="login" hidden>
        <input id="pw" type="password" placeholder="PASSWORD" autocomplete="current-password" aria-label="Password" required>
        <button class="primary" type="submit">Unlock</button>
      </form>
      <ul id="cloudList"></ul>
      <div id="cloudMsg" class="muted"></div>
      <button id="logout" class="link" hidden>Lock</button>
      <div id="err" role="alert"></div>
    </div>
    <div class="core">
      <label>DS CORE
        <select id="ndsCore">
          <option value="desmume">DeSmuME</option>
          <option value="melonds">melonDS</option>
        </select>
      </label>
      <div id="coreNote" class="muted"></div>
    </div>
  </section>

  <section class="box">
    <h2>STORED</h2>
    <ul id="lib"></ul>
    <div id="empty" hidden>NO GAMES STORED.</div>
  </section>

</main>

<section id="player" hidden>
  <div class="bar">
    <button id="back">Exit</button>
    <span class="t" id="title"></span>
    <span id="sync" class="sync"></span>
    <button id="guideBtn" hidden>Guide</button>
  </div>
  <div id="conflict" class="conflict" hidden>
    <span id="conflictMsg"></span>
    <button id="useCloud" class="primary">Cloud save</button>
    <button id="useLocal">This browser</button>
  </div>
  <div class="screen"><aside id="guideL" class="guide" hidden aria-label="Guide map"></aside><div id="game"></div><aside id="guide" class="guide" hidden aria-label="Guide"></aside></div>
</section>

<script src="js/app.js"></script>
<script src="js/savesync.js"></script>
<script src="js/story.js"></script>
<script src="js/guide.js"></script>
<script src="js/expshare.js"></script>
<script src="js/library.js"></script>
</body>
</html>
